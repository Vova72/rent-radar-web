<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Rent Radar</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* Всё оформление берётся из темы Telegram: у человека может быть тёмная,
   светлая или одна из цветных. Хардкод цвета — это гарантированно белая
   плашка на чёрном фоне у части пользователей. Фолбэки только на случай
   открытия страницы вне Telegram. */
:root {
  --bg:        var(--tg-theme-bg-color, #ffffff);
  --card:      var(--tg-theme-secondary-bg-color, #f2f2f7);
  --text:      var(--tg-theme-text-color, #000000);
  --hint:      var(--tg-theme-hint-color, #8e8e93);
  --accent:    var(--tg-theme-button-color, #3390ec);
  --on-accent: var(--tg-theme-button-text-color, #ffffff);
  --link:      var(--tg-theme-link-color, #3390ec);
  --radius: 12px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  margin: 0;
  padding: 12px 14px 96px;
  font-size: 15px;
  line-height: 1.4;
}

.card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: 12px;
}

.card h2 {
  margin: 0 0 12px;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: .04em;
  text-transform: uppercase;
  color: var(--hint);
}

.hint { font-size: 12px; color: var(--hint); margin: 8px 0 0; }

/* ---------- Чипы: районы, города, выбранное ---------- */

.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
  gap: 6px;
}

.chip {
  border: 1px solid transparent;
  background: var(--bg);
  color: var(--text);
  border-radius: 10px;
  padding: 8px 10px;
  font-size: 14px;
  cursor: pointer;
  text-align: left;
  font-family: inherit;
  overflow: hidden;
  transition: background .12s, color .12s;
}
.chip b { display: block; font-size: 14px; font-weight: 600; }
.chip small {
  display: block;
  font-size: 10px;
  color: var(--hint);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.chip.on { background: var(--accent); color: var(--on-accent); }
.chip.on small { color: var(--on-accent); opacity: .8; }

.chip.wide { grid-column: 1 / -1; text-align: center; }
.chip.wide b { font-size: 14px; }

.tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--accent);
  color: var(--on-accent);
  border: none;
  border-radius: 14px;
  padding: 6px 10px;
  font-size: 13px;
  font-family: inherit;
  cursor: pointer;
}
.tag span { font-size: 15px; line-height: 1; opacity: .75; }

/* Районы свёрнуты по умолчанию: 23 плитки занимали весь экран, а нужны они
   далеко не всем — большинству хватает «Wien» целиком. Раскрываются сами,
   если у человека уже выбран хотя бы один район. */

details { margin-top: 10px; }

details summary {
  display: flex;
  align-items: center;
  gap: 8px;
  list-style: none;
  cursor: pointer;
  padding: 10px 12px;
  border-radius: 10px;
  background: var(--bg);
  font-size: 14px;
  user-select: none;
}
details summary::-webkit-details-marker { display: none; }
details summary::before {
  content: '';
  width: 0;
  height: 0;
  border-left: 5px solid currentColor;
  border-top: 4px solid transparent;
  border-bottom: 4px solid transparent;
  opacity: .5;
  transition: transform .15s;
}
details[open] summary::before { transform: rotate(90deg); }
details summary b {
  margin-left: auto;
  font-size: 12px;
  font-weight: 600;
  color: var(--accent);
}
details .grid { margin-top: 8px; }

/* Переключатель города внутри блока районов. Появляется только когда
   выбрано больше одного города: при одном он был бы кнопкой без выбора. */
.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.tabs button {
  border: none;
  background: var(--bg);
  color: var(--hint);
  border-radius: 8px;
  padding: 6px 10px;
  font: inherit;
  font-size: 13px;
  cursor: pointer;
}
.tabs button.on { background: var(--accent); color: var(--on-accent); }

/* ---------- Поиск по адресу ---------- */

.search { position: relative; }

input[type="search"] {
  width: 100%;
  padding: 11px 12px;
  border: none;
  border-radius: 10px;
  background: var(--bg);
  color: var(--text);
  font-size: 16px;      /* меньше 16px — iOS зумит страницу при фокусе */
  font-family: inherit;
  outline: none;
  -webkit-appearance: none;
}
input[type="search"]::-webkit-search-cancel-button { -webkit-appearance: none; }

#found {
  position: absolute;
  z-index: 20;
  top: calc(100% + 4px);
  left: 0;
  right: 0;
  max-height: 210px;
  overflow-y: auto;
  background: var(--bg);
  border-radius: 10px;
  box-shadow: 0 6px 24px rgba(0,0,0,.28);
  display: none;
}
#found button {
  display: block;
  width: 100%;
  text-align: left;
  background: none;
  border: none;
  color: var(--text);
  font: inherit;
  padding: 11px 12px;
  cursor: pointer;
}
#found button + button { border-top: 1px solid var(--card); }
#found .msg { padding: 11px 12px; color: var(--hint); font-size: 13px; }

/* ---------- Ползунки ---------- */

.range + .range { margin-top: 22px; }

.range-top {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 14px;
}
.range-top .name { font-size: 14px; color: var(--hint); }
.range-top .value { font-size: 15px; font-weight: 600; }

.slider { position: relative; height: 24px; }
.slider .rail,
.slider .fill {
  position: absolute;
  height: 4px;
  top: 50%;
  transform: translateY(-50%);
  border-radius: 2px;
}
.slider .rail { left: 0; right: 0; background: var(--hint); opacity: .35; }
.slider .fill { background: var(--accent); }

.slider input {
  position: absolute;
  width: 100%;
  height: 100%;
  top: 0;
  left: 0;
  margin: 0;
  background: none;
  pointer-events: none;   /* клики проходят насквозь, ловят только «кружки» */
  -webkit-appearance: none;
  appearance: none;
}
.slider input::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--accent);
  border: 3px solid #fff;
  box-shadow: 0 1px 4px rgba(0,0,0,.35);
  pointer-events: auto;
  cursor: pointer;
}
.slider input::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--accent);
  border: 3px solid #fff;
  pointer-events: auto;
  cursor: pointer;
}

/* ---------- Переключатель ---------- */

.switch {
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
}
.switch .body { flex: 1; }
.switch .title { font-size: 15px; }
.switch .sub { font-size: 12px; color: var(--hint); margin-top: 2px; }
.switch input { display: none; }
.switch .track {
  flex: 0 0 auto;
  width: 46px;
  height: 28px;
  border-radius: 14px;
  background: var(--hint);
  opacity: .45;
  position: relative;
  transition: background .15s, opacity .15s;
}
.switch input:checked + .track { background: var(--accent); opacity: 1; }
.switch .track::after {
  content: '';
  position: absolute;
  top: 3px;
  left: 3px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: #fff;
  transition: transform .15s;
}
.switch input:checked + .track::after { transform: translateX(18px); }

/* Метка стенда. Один и тот же файл лежит и в корне (прод), и в /dev/;
   он сам смотрит, откуда его открыли, и показывает плашку только на деве.
   Так «выкатить в прод» — это буквально копирование файла без правок,
   а не редактирование с риском забыть убрать отладочный флаг. */
#stand {
  display: none;
  position: fixed;
  top: 0;
  right: 0;
  z-index: 100;
  padding: 3px 10px;
  border-bottom-left-radius: 8px;
  background: #e8a33d;
  color: #000;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .08em;
}

/* Вне Telegram MainButton не существует — без этой кнопки страницу
   невозможно даже проверить в обычном браузере. */
#fallback-save {
  display: none;
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 10px;
  background: var(--accent);
  color: var(--on-accent);
  font: inherit;
  font-weight: 600;
  cursor: pointer;
}
</style>
</head>
<body>

<div id="stand">DEV</div>

<div class="card">
  <h2 id="l-where">Где ищем</h2>
  <div class="search">
    <input type="search" id="q" autocomplete="off" enterkeyhint="search">

         рядом с ними, а не в отдельном «о программе». Намеренно без перевода:
         это имя собственное и код лицензии. -->
    <p class="hint" id="geonames-credit">
      Bezirke: <a href="https://www.geonames.org/" target="_blank" rel="noopener">GeoNames</a>, CC BY 4.0
    </p>
  </details>
</div>

<div class="card" id="chosen-card" style="display:none">
  <h2 id="l-chosen">Выбрано</h2>
  <div class="chips" id="chosen"></div>
  <p class="hint" id="l-chosen-hint"></p>
</div>

<div class="card">
  <h2 id="l-params">Параметры</h2>

    <div class="slider">
      <div class="rail"></div><div class="fill" id="f-price"></div>

  </div>

  <div class="range">
    <div class="range-top"><span class="name" id="l-sq">Площадь</span><span class="value" id="v-sq"></span></div>
    <div class="slider">
      <div class="rail"></div><div class="fill" id="f-sq"></div>
      <input type="range" id="sq-min" min="0" max="150" step="5" value="0">
      <input type="range" id="sq-max" min="0" max="150" step="5" value="150">
    </div>
  </div>

  <div class="range">
    <div class="range-top"><span class="name" id="l-rooms">Комнаты</span><span class="value" id="v-rooms"></span></div>
    <div class="slider">
      <div class="rail"></div><div class="fill" id="f-rooms"></div>
      <input type="range" id="rooms-min" min="1" max="6" step="1" value="1">
      <input type="range" id="rooms-max" min="1" max="6" step="1" value="6">
    </div>
  </div>
</div>

<div class="card">
  <label class="switch">
    <div class="body">
      <div class="title" id="l-agency">Скрывать объявления агентств</div>
      <div class="sub" id="l-agency-sub"></div>
    </div>
    <input type="checkbox" id="hide-agencies"><div class="track"></div>
  </label>
</div>

<button id="fallback-save"></button>

<script>

  || 'en';

if (!I18N[lang]) lang = 'en';
var T = I18N[lang];

/* ------------------------------------------------------------------
   Данные о местах. МАШИННЫЙ БЛОК — пересобирается скриптом
   scripts/build_city_postcodes.py в репозитории rent-radar.

   Индекс — это то, что бот сравнивает точно (\d{4} в фильтре), поэтому
   value плитки содержит индекс. У городов, которых здесь нет, индекс один
   на весь город: выбирать нечего, и бот всё равно найдёт их по названию.

   Сюда попадает ТОЛЬКО индекс, по которому реально приходили объявления
   (замер по выдаче Willhaben, 11 394 объявления). Брать все индексы города
   из справочника нельзя: в Зальцбурге их 13, а объявления идут по одному —
   остальные двенадцать плиток нажимались бы и молча не находили ничего.

   Подпись перечисляет ВСЕ районы, которые накрывает индекс, и это важно.
   У Вены соответствие взаимно однозначное: 1010 — это ровно 1-й район.
   Больше нигде в Австрии так не устроено: грацкий 8010 накрывает десять
   Bezirke, и написать на плитке «Innere Stadt» значило бы соврать о том,
   что будет выбрано. Где имён нет у самого справочника — подписи нет.

   Названия районов: GeoNames, CC BY 4.0.
------------------------------------------------------------------ */

  "Graz", "Linz", "Salzburg", "Innsbruck", "Klagenfurt", "Villach", "Wels",

/* Первый ряд — то, что выбирают чаще всего, чтобы до этого не надо было
   печатать. «Wien» здесь означает всю Вену целиком: отдельная кнопка
   «Вся Вена» над районами была тем же самым, только занимала ещё строку. */
var POPULAR = ["Wien", "Graz", "Linz", "Salzburg", "Innsbruck", "Klagenfurt"];

var ALL_VIENNA = "Wien";

/* ------------------------------------------------------------------
   Состояние
------------------------------------------------------------------ */

var chosen = [];      // массив строк ровно в том виде, в каком уедут боту
var activeCity = ALL_VIENNA;   // чьи районы сейчас показаны в блоке

function has(v) { return chosen.indexOf(v) !== -1; }

function districtValue(city, d) { return d[0] + " " + city; }

/* Все значения-районы всех городов сразу: нужно, чтобы отличить «выбран
   город» от «выбран район города» в одном плоском списке chosen. */
var DISTRICT_VALUES = (function () {
  var set = {};
  Object.keys(DISTRICTS).forEach(function (city) {
    DISTRICTS[city].forEach(function (d) { set[districtValue(city, d)] = city; });
  });
  return set;
})();

function isDistrict(v) { return Object.prototype.hasOwnProperty.call(DISTRICT_VALUES, v); }
function cityOfDistrict(v) { return DISTRICT_VALUES[v]; }

/*
 * Города, между которыми есть смысл переключаться в блоке районов.
 *
 * Это НЕ «выбранные города»: выбрав «1090 Wien», человек снимает с выбора
 * «Wien» целиком (город перекрывает свои районы), но Вена от этого не
 * перестаёт быть местом, где он ищет. Если считать только выбранные города,
 * вкладка «Wien» исчезала бы ровно в момент клика по первому району — прямо
 * под пальцем, вместе с сеткой, в которую он целился дальше.
 */
function tabCities() {
  var out = [];
  chosen.forEach(function (v) {
    var city = isDistrict(v) ? cityOfDistrict(v) : v;
    if (out.indexOf(city) === -1) out.push(city);
  });
  // Города, у которых район выбрать вообще можно, доступны всегда — иначе,
  // выбрав Грац, человек терял бы дорогу обратно к районам Вены.
  Object.keys(DISTRICTS).forEach(function (city) {
    if (out.indexOf(city) === -1) out.push(city);
  });
  if (out.indexOf(activeCity) === -1) out.push(activeCity);
  return out;
}

function toggle(v) {
  var i = chosen.indexOf(v);
  if (i !== -1) { chosen.splice(i, 1); render(); return; }

  // Город и его районы вместе бессмысленны: город матчится по имени и
  // перекрывает любые свои районы. Взаимоисключение — только внутри одного
  // города: выбрать «Graz» и «1090 Wien» одновременно совершенно законно.
  if (isDistrict(v)) {
    var city = cityOfDistrict(v);
    chosen = chosen.filter(function (x) { return x !== city; });
    activeCity = city;
  } else if (DISTRICTS[v]) {
    chosen = chosen.filter(function (x) { return cityOfDistrict(x) !== v; });
    activeCity = v;
  } else {
    activeCity = v;
  }
  chosen.push(v);
  render();
}

/* ------------------------------------------------------------------
   Отрисовка
------------------------------------------------------------------ */

var $ = function (id) { return document.getElementById(id); };

function button(cls, html, onclick) {
  var b = document.createElement('button');
  b.type = 'button';
  b.className = cls;
  b.innerHTML = html;
  b.onclick = onclick;
  return b;
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}

function renderTabs() {
  var box = $('city-tabs');
  var cities = tabCities();
  box.innerHTML = '';

  // При одном выбранном городе вкладка была бы кнопкой без выбора —
  // название и так стоит в заголовке блока.
  if (cities.length < 2) return;

  cities.forEach(function (city) {
    box.appendChild(button(city === activeCity ? 'on' : '', esc(city), function () {
      activeCity = city;
      render();
    }));
  });
}

function renderDistricts() {
  var box = $('districts');
  var list = DISTRICTS[activeCity] || null;

  $('l-districts').textContent = T.districts_of.replace('{city}', activeCity);

  box.innerHTML = '';
  $('no-districts').textContent = list ? '' : T.no_districts.replace('{city}', activeCity);

  var picked = chosen.filter(function (v) { return cityOfDistrict(v) === activeCity; }).length;
  $('districts-count').textContent = picked ? String(picked) : '';

  if (!list) return;

  list.forEach(function (d) {
    var v = districtValue(activeCity, d);
    var chip = button(
      'chip' + (has(v) ? ' on' : ''),
      '<b>' + d[0] + '</b><small>' + esc(d[1]) + '</small>',
      function () { toggle(v); }
    );
    // Подпись обрезается по ширине плитки (text-overflow: ellipsis), а у
    // Граца в ней до десяти районов. Полное перечисление кладём в title —
    // иначе человек видит «Andritz, Geidorf, Inn…» и не знает, что ещё внутри.
    if (d[1]) chip.title = d[0] + " — " + d[1];
    box.appendChild(chip);
  });
}

function renderPopular() {
  var box = $('popular');
  box.innerHTML = '';
  POPULAR.forEach(function (city) {
    box.appendChild(button(
      'chip' + (has(city) ? ' on' : ''),
      '<b>' + esc(city) + '</b>',
      function () { toggle(city); }
    ));
  });
}

function renderChosen() {
  var box = $('chosen');
  box.innerHTML = '';
  $('chosen-card').style.display = chosen.length ? '' : 'none';
  chosen.forEach(function (v) {
    box.appendChild(button('tag', esc(label(v)) + '<span>&times;</span>',
      function () { toggle(v); }));
  });
}

function label(v) {
  var city = cityOfDistrict(v);
  if (!city) return v;
  var code = v.split(' ')[0];
  var d = DISTRICTS[city].filter(function (x) { return x[0] === code; })[0];
  if (!d) return v;
  // Имя района ставим в тег, только если оно короткое. У Вены это всегда так
  // («1090 Alsergrund»), а у Граца индекс накрывает десять районов, и полное
  // перечисление растянуло бы тег на пол-экрана. Тогда показываем город —
  // «8010 Graz», — а перечисление остаётся в подписи плитки и в title.
  return d[1] && d[1].length <= 24 ? d[0] + " " + d[1] : d[0] + " " + city;
}

function render() {
  // Активный город мог исчезнуть из выбора — тогда показываем первый
  // оставшийся, а если не осталось ни одного, возвращаемся к Вене.
  var cities = tabCities();
  if (cities.indexOf(activeCity) === -1) activeCity = cities[0] || ALL_VIENNA;

  renderTabs();
  renderDistricts();
  renderPopular();
  renderChosen();
}

/* ------------------------------------------------------------------
   Ползунки

   Главное здесь — потолок означает «без ограничения» и уезжает боту как
   null, а не как своё числовое значение. Иначе фильтр «до 150 м²»,
   который человек никогда не двигал, молча отсекает всё, что больше:
   в боевой базе на этом потолке стояло 11 фильтров из 21, и их владельцы
   просто не видели больших квартир.
------------------------------------------------------------------ */

function setupRange(id, fmt) {
  var lo = $(id + '-min'), hi = $(id + '-max'), fill = $('f-' + id), out = $('v-' + id);

  function paint(e) {
    var a = +lo.value, b = +hi.value;
    if (a > b) {
      if (e && e.target === lo) { lo.value = b; a = b; } else { hi.value = a; b = a; }
    }
    var span = +lo.max - +lo.min;
    fill.style.left  = ((a - +lo.min) / span * 100) + '%';
    fill.style.right = (100 - (b - +hi.min) / span * 100) + '%';
    out.textContent = fmt(a, b, a === +lo.min, b === +hi.max);
  }

  lo.addEventListener('input', paint);
  hi.addEventListener('input', paint);
  return paint;
}

function bound(id) {
  var lo = $(id + '-min'), hi = $(id + '-max');
  return {
    min: +lo.value === +lo.min ? null : +lo.value,
    max: +hi.value === +hi.max ? null : +hi.value
  };
}

var paintPrice = setupRange('price', function (a, b, floor, ceil) {
  if (floor && ceil) return T.any;
  if (floor) return T.to + ' ' + b + ' €';
  if (ceil)  return T.from + ' ' + a + ' €';
  return a + ' – ' + b + ' €';
});

var paintSq = setupRange('sq', function (a, b, floor, ceil) {
  if (floor && ceil) return T.any;
  if (floor) return T.to + ' ' + b + ' m²';
  if (ceil)  return T.from + ' ' + a + ' m²';
  return a + ' – ' + b + ' m²';
});

var paintRooms = setupRange('rooms', function (a, b, floor, ceil) {
  if (floor && ceil) return T.any_m;
  if (floor) return T.to + ' ' + b;
  if (ceil)  return T.from + ' ' + a;
  return a === b ? String(a) : a + ' – ' + b;
});

/* ------------------------------------------------------------------
   Поиск по адресу

   Сначала свой список — он мгновенный и работает без сети. Nominatim
   подключается только если своего совпадения не нашлось: это чужой
   бесплатный сервис, и дёргать его на каждую букву некрасиво и медленно.
------------------------------------------------------------------ */

var searchTimer = null;

function localMatches(q) {
  var out = [];
  Object.keys(DISTRICTS).forEach(function (city) {
    DISTRICTS[city].forEach(function (d) {
      if ((d[0] + ' ' + d[1] + ' ' + city).toLowerCase().indexOf(q) !== -1) {
        out.push({ label: d[0] + ' ' + d[1] + ' (' + city + ')', value: districtValue(city, d) });
      }
    });
  });
  CITIES.forEach(function (c) {
    if (c.toLowerCase().indexOf(q) !== -1) out.push({ label: c, value: c });
  });
  return out;
}

function showResults(items, message) {
  var box = $('found');
  box.innerHTML = '';
  items.forEach(function (it) {
    box.appendChild(button('', esc(it.label), function () {
      if (!has(it.value)) toggle(it.value);
      if (isDistrict(it.value)) $('areas').open = true;
      $('q').value = '';
      box.style.display = 'none';
    }));
  });
  if (message) {
    var div = document.createElement('div');
    div.className = 'msg';
    div.textContent = message;
    box.appendChild(div);
  }
  box.style.display = (items.length || message) ? 'block' : 'none';
}

$('q').addEventListener('input', function () {
  var q = $('q').value.trim().toLowerCase();
  clearTimeout(searchTimer);

  if (q.length < 2) { $('found').style.display = 'none'; return; }

  var local = localMatches(q);
  showResults(local, local.length ? null : T.searching);
  if (local.length) return;

  searchTimer = setTimeout(function () { remoteSearch(q); }, 450);
});

function remoteSearch(q) {
  var url = 'https://nominatim.openstreetmap.org/search'
    + '?countrycodes=at&format=json&addressdetails=1&limit=8&accept-language=de&q='
    + encodeURIComponent(q);

  fetch(url)
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if ($('q').value.trim().toLowerCase() !== q) return;   // человек уже допечатал
      var items = [];
      (data || []).forEach(function (p) {
        var a = p.address || {};
        var city = a.city || a.town || a.village || a.municipality || p.name;
        if (!city) return;
        // Боту уезжает индекс, если он есть: его он сравнивает точно.
        // Название города — запасной вариант, оно матчится по границе слова.
        var value = a.postcode || city;
        var text = a.postcode ? a.postcode + ' ' + city : city;
        if (items.some(function (i) { return i.value === value; })) return;
        items.push({ label: text, value: value });
      });
      showResults(items, items.length ? null : T.empty);
    })
    .catch(function () { showResults([], T.offline); });
}

document.addEventListener('click', function (e) {
  if (!e.target.closest('.search')) $('found').style.display = 'none';
});

/* ------------------------------------------------------------------
   Восстановление фильтров, присланных ботом
------------------------------------------------------------------ */

function restore(id, name, fallbackToBound) {
  var el = $(id);
  var v = params.get(name);
  el.value = (v !== null && v !== '') ? v : fallbackToBound;
}

(function init() {
  // Стенд определяется по пути, а не по флагу в коде: /dev/ — дев, корень — прод
  if (/\/dev\/?$|\/dev\//.test(window.location.pathname)) {
    $('stand').style.display = 'block';
  }

  // Подписи
  $('l-where').textContent = T.where;
  $('l-chosen').textContent = T.chosen;
  $('l-chosen-hint').textContent = T.chosen_hint;
  $('l-params').textContent = T.params;
  $('l-price').textContent = T.price;
  $('l-sq').textContent = T.sq;
  $('l-rooms').textContent = T.rooms;
  $('l-agency').textContent = T.agency;
  $('l-agency-sub').textContent = T.agency_sub;
  $('q').placeholder = T.search_ph;
  $('fallback-save').textContent = T.save;

  var cities = params.get('cities');
  if (cities) {
    cities.split(',').forEach(function (c) {
      var v = c.trim();
      if (v && !has(v)) chosen.push(v);
    });
  }

  restore('price-min', 'min_price', 0);
  restore('price-max', 'max_price', 3000);
  restore('sq-min',    'min_sq',    0);
  restore('sq-max',    'max_sq',    150);
  restore('rooms-min', 'min_rooms', 1);
  restore('rooms-max', 'max_rooms', 6);
  $('hide-agencies').checked = params.get('hide_agencies') === '1';

  render();
  paintPrice(); paintSq(); paintRooms();

  // Раскрываем районы сразу, если человек их уже выбирал: иначе он открывает
  // фильтры и не видит собственного выбора — выглядит как потеря настроек.
  if (chosen.some(isDistrict)) $('areas').open = true;

  if (tg) {
    tg.MainButton.setText(T.save);
    tg.MainButton.show();
    tg.MainButton.onClick(save);
  } else {
    $('fallback-save').style.display = 'block';
    $('fallback-save').onclick = save;
  }
})();

function save() {
  var data = {
    locations: chosen,
    price: bound('price'),
    square_meters: bound('sq'),
    rooms: bound('rooms'),
    hide_agencies: $('hide-agencies').checked
  };
  if (tg) tg.sendData(JSON.stringify(data));
  else console.log(JSON.stringify(data, null, 2));
}
</script>
