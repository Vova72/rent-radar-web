<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фильтры Rent Radar</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 20px;
            margin: 0;
            padding-bottom: 80px; /* Отступ для главной кнопки ТГ */
        }
        h3 {
            margin-top: 0;
            color: var(--tg-theme-hint-color, #999999);
            font-size: 14px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        .section { margin-bottom: 30px; }
        
        label.checkbox-label { 
            display: flex; 
            align-items: center;
            margin-bottom: 10px; 
            font-size: 16px; 
        }
        input[type="checkbox"] { margin-right: 10px; width: 18px; height: 18px; }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid var(--tg-theme-hint-color, #ccc);
            border-radius: 8px;
            background-color: var(--tg-theme-secondary-bg-color, #f4f4f5);
            color: var(--tg-theme-text-color, #000);
            font-size: 16px;
        }

        /* --- МАГИЯ ДВОЙНОГО ПОЛЗУНКА --- */
        .slider-header {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 15px;
        }
        .dual-slider-container {
            position: relative;
            width: 100%;
            height: 30px;
        }
        .slider-track {
            position: absolute;
            width: 100%;
            height: 4px;
            background-color: var(--tg-theme-hint-color, #d3d3d3);
            border-radius: 4px;
            top: 50%;
            transform: translateY(-50%);
        }
        .slider-progress {
            position: absolute;
            height: 4px;
            background-color: var(--tg-theme-button-color, #3390ec);
            border-radius: 4px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 1;
        }
        .dual-slider-container input[type="range"] {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            margin: 0;
            background: transparent;
            -webkit-appearance: none;
            pointer-events: none; /* Пропускаем клики сквозь инпут */
            z-index: 2;
        }
        .dual-slider-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background-color: var(--tg-theme-button-color, #3390ec);
            border: 3px solid #ffffff;
            box-shadow: 0 1px 4px rgba(0,0,0,0.3);
            pointer-events: auto; /* Возвращаем клики только на кружочки */
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="section">
        <h3 id="t_mode">Что ищем?</h3>
        <label class="checkbox-label">
            <input type="checkbox" id="mode_apt" value="apartment" checked> 
            <span id="t_apt">Квартиры</span>
        </label>
        <label class="checkbox-label">
            <input type="checkbox" id="mode_wg" value="wg_zimmer"> 
            <span id="t_wg">Комнаты (WG)</span>
        </label>
    </div>

    <div class="section">
        <h3 id="t_loc">Города или Индексы</h3>
        <div style="position: relative;">
            <input type="text" id="location_input" placeholder="Начни вводить (например: Wien или 1090)..." autocomplete="off" oninput="searchLocation()">
            <div id="suggestions" style="display: none; position: absolute; width: 100%; background: var(--tg-theme-bg-color, #fff); border: 1px solid var(--tg-theme-hint-color, #ccc); max-height: 150px; overflow-y: auto; z-index: 100; box-shadow: 0px 4px 6px rgba(0,0,0,0.1);"></div>
        </div>
        <div id="selected_locations" style="margin-top: 10px; display: flex; flex-wrap: wrap; gap: 5px;"></div>
    </div>

    <div class="section">
        <h3 id="t_price">Цена</h3>
        <div class="slider-header">
            <span id="price_display_min">€0</span>
            <span id="price_display_max">€3000+</span>
        </div>
        <div class="dual-slider-container">
            <div class="slider-track"></div>
            <div class="slider-progress" id="price_progress"></div>
            <input type="range" id="price_min" min="0" max="3000" step="50" value="0">
            <input type="range" id="price_max" min="0" max="3000" step="50" value="3000">
        </div>
    </div>
    
    <div class="section">
        <h3 id="t_sq">Площадь</h3>
        <div class="slider-header">
            <span id="sq_display_min">0 м²</span>
            <span id="sq_display_max">150+ м²</span>
        </div>
        <div class="dual-slider-container">
            <div class="slider-track"></div>
            <div class="slider-progress" id="sq_progress"></div>
            <input type="range" id="sq_min" min="0" max="150" step="5" value="0">
            <input type="range" id="sq_max" min="0" max="150" step="5" value="150">
        </div>
    </div>

    <div class="section">
        <h3 id="t_rooms">Комнаты</h3>
        <div class="slider-header">
            <span id="rooms_display_min">1</span>
            <span id="rooms_display_max">6+</span>
        </div>
        <div class="dual-slider-container">
            <div class="slider-track"></div>
            <div class="slider-progress" id="rooms_progress"></div>
            <input type="range" id="rooms_min" min="1" max="6" step="1" value="1">
            <input type="range" id="rooms_max" min="1" max="6" step="1" value="6">
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // --- 0. СЛОВАРЬ ПЕРЕВОДОВ ---
        const i18n = {
            en: {
                t_mode: "What are you looking for?", t_apt: "Apartments", t_wg: "Rooms (WG)",
                t_loc: "Cities or Postcodes", t_loc_ph: "Start typing (e.g., Wien or 1090)...",
                t_price: "Price", t_sq: "Area", t_rooms: "Rooms", btn_save: "SAVE FILTERS",
                api_search: "Searching across Austria... ⏳", api_empty: "Nothing found 🤷‍♂️"
            },
            de: {
                t_mode: "Was suchst du?", t_apt: "Wohnungen", t_wg: "Zimmer (WG)",
                t_loc: "Städte oder PLZ", t_loc_ph: "Tippen beginnen (z.B. Wien oder 1090)...",
                t_price: "Preis", t_sq: "Fläche", t_rooms: "Zimmer", btn_save: "FILTER SPEICHERN",
                api_search: "Suche in Österreich... ⏳", api_empty: "Nichts gefunden 🤷‍♂️"
            },
            uk: {
                t_mode: "Що шукаємо?", t_apt: "Квартири", t_wg: "Кімнати (WG)",
                t_loc: "Міста або Індекси", t_loc_ph: "Почни вводити (наприклад: Wien або 1090)...",
                t_price: "Ціна", t_sq: "Площа", t_rooms: "Кімнати", btn_save: "ЗБЕРЕГТИ ФІЛЬТРИ",
                api_search: "Шукаємо по всій Австрії... ⏳", api_empty: "Нічого не знайдено 🤷‍♂️"
            },
            ru: {
                t_mode: "Что ищем?", t_apt: "Квартиры", t_wg: "Комнаты (WG)",
                t_loc: "Города или Индексы", t_loc_ph: "Начни вводить (например: Wien или 1090)...",
                t_price: "Цена", t_sq: "Площадь", t_rooms: "Комнаты", btn_save: "СОХРАНИТЬ ФИЛЬТРЫ",
                api_search: "Ищем по всей Австрии... ⏳", api_empty: "Ничего не найдено 🤷‍♂️"
            }
        };

        // Определяем язык телефона (если не нашли - ставим английский)
        let userLang = (tg.initDataUnsafe?.user?.language_code || 'en').substring(0, 2);
        if (!['ru', 'uk', 'en', 'de'].includes(userLang)) userLang = 'en';

        // Применяем переводы
        document.getElementById('t_mode').innerText = i18n[userLang].t_mode;
        document.getElementById('t_apt').innerText = i18n[userLang].t_apt;
        document.getElementById('t_wg').innerText = i18n[userLang].t_wg;
        document.getElementById('t_loc').innerText = i18n[userLang].t_loc;
        document.getElementById('location_input').placeholder = i18n[userLang].t_loc_ph;
        document.getElementById('t_price').innerText = i18n[userLang].t_price;
        document.getElementById('t_sq').innerText = i18n[userLang].t_sq;
        document.getElementById('t_rooms').innerText = i18n[userLang].t_rooms;
        
        tg.MainButton.text = i18n[userLang].btn_save;
        tg.MainButton.show();

        let selectedLocations = [];
        let debounceTimer; 

        const AUSTRIAN_LOCATIONS = [
            "Wien (Вся Вена)",
            "1010 Wien (Innere Stadt)", "1020 Wien (Leopoldstadt)", "1030 Wien (Landstraße)",
            "1040 Wien (Wieden)", "1050 Wien (Margareten)", "1060 Wien (Mariahilf)",
            "1070 Wien (Neubau)", "1080 Wien (Josefstadt)", "1090 Wien (Alsergrund)",
            "1100 Wien (Favoriten)", "1110 Wien (Simmering)", "1120 Wien (Meidling)",
            "1130 Wien (Hietzing)", "1140 Wien (Penzing)", "1150 Wien (Rudolfsheim-Fünfhaus)",
            "1160 Wien (Ottakring)", "1170 Wien (Hernals)", "1180 Wien (Währing)",
            "1190 Wien (Döbling)", "1200 Wien (Brigittenau)", "1210 Wien (Floridsdorf)",
            "1220 Wien (Donaustadt)", "1230 Wien (Liesing)",
            "Graz", "Linz", "Salzburg", "Innsbruck", "Klagenfurt", "Villach", 
            "Wels", "St. Pölten", "Dornbirn", "Wiener Neustadt"
        ];

        // --- 1. МАГИЯ ПОЛЗУНКОВ (Двигаем синюю полосу и обновляем текст) ---
        function setupDualSlider(minId, maxId, progressId, minDisplayId, maxDisplayId, prefix, postfix, showPlusOnMax) {
            const minSlider = document.getElementById(minId);
            const maxSlider = document.getElementById(maxId);
            const progress = document.getElementById(progressId);
            const minDisplay = document.getElementById(minDisplayId);
            const maxDisplay = document.getElementById(maxDisplayId);

            function updateUI(e) {
                let minVal = parseInt(minSlider.value);
                let maxVal = parseInt(maxSlider.value);

                // Не даем ползункам пересечься
                if (minVal > maxVal) {
                    if (e && e.target === minSlider) {
                        minSlider.value = maxVal;
                        minVal = maxVal;
                    } else {
                        maxSlider.value = minVal;
                        maxVal = minVal;
                    }
                }

                // Высчитываем проценты для синей полосы
                const minPercent = ((minVal - minSlider.min) / (minSlider.max - minSlider.min)) * 100;
                const maxPercent = ((maxVal - maxSlider.min) / (maxSlider.max - maxSlider.min)) * 100;

                progress.style.left = minPercent + "%";
                progress.style.right = (100 - maxPercent) + "%";

                // Обновляем текст
                minDisplay.innerText = `${prefix}${minVal}${postfix}`;
                maxDisplay.innerText = `${prefix}${maxVal}${showPlusOnMax && maxVal == maxSlider.max ? '+' : ''}${postfix}`;
            }

            minSlider.addEventListener('input', updateUI);
            maxSlider.addEventListener('input', updateUI);
            
            return updateUI; // Возвращаем функцию, чтобы дернуть её при загрузке
        }

        // --- 2. ИНИЦИАЛИЗАЦИЯ И ВОССТАНОВЛЕНИЕ ДАННЫХ ---
        document.addEventListener("DOMContentLoaded", () => {
            
            // Оживляем ползунки и сохраняем функции их обновления
            const updatePrice = setupDualSlider('price_min', 'price_max', 'price_progress', 'price_display_min', 'price_display_max', '€', '', true);
            const updateSq = setupDualSlider('sq_min', 'sq_max', 'sq_progress', 'sq_display_min', 'sq_display_max', '', ' м²', true);
            const updateRooms = setupDualSlider('rooms_min', 'rooms_max', 'rooms_progress', 'rooms_display_min', 'rooms_display_max', '', '', true);

            const urlParams = new URLSearchParams(window.location.search);
            
            // Восстанавливаем галочки
            if (urlParams.has('modes')) {
                const modes = urlParams.get('modes').split(',');
                document.getElementById('mode_apt').checked = modes.includes('apartment');
                document.getElementById('mode_wg').checked = modes.includes('wg_zimmer');
            }

            // Восстанавливаем города
            if (urlParams.has('cities')) {
                const cities = urlParams.get('cities').split(',');
                cities.forEach(city => {
                    if (city) addLocation(city);
                });
            }

            // Восстанавливаем цифры
            const setVal = (id, param) => {
                if (urlParams.has(param)) {
                    const el = document.getElementById(id);
                    if (el) el.value = urlParams.get(param);
                }
            };

            // Если бот прислал сохраненные фильтры — подставляем их
            if (urlParams.toString().length > 0) {
                setVal('price_min', 'min_price');
                setVal('price_max', 'max_price');
                setVal('sq_min', 'min_sq');
                setVal('sq_max', 'max_sq');
                setVal('rooms_min', 'min_rooms');
                setVal('rooms_max', 'max_rooms');
            }
            
            // ПРИНУДИТЕЛЬНО обновляем интерфейс ползунков, чтобы они встали на свои места!
            updatePrice();
            updateSq();
            updateRooms();
        });

        // --- 3. СОХРАНЕНИЕ ДАННЫХ В ТЕЛЕГРАМ ---
        tg.MainButton.onClick(() => {
            let searchModes = [];
            if (document.getElementById('mode_apt').checked) searchModes.push('apartment');
            if (document.getElementById('mode_wg').checked) searchModes.push('wg_zimmer');

            const getVal = (id) => document.getElementById(id).value ? parseInt(document.getElementById(id).value) : null;

            const data = {
                search_modes: searchModes,
                locations: selectedLocations, 
                price: { min: getVal('price_min'), max: getVal('price_max') },
                rooms: { min: getVal('rooms_min'), max: getVal('rooms_max') },
                square_meters: { min: getVal('sq_min'), max: getVal('sq_max') }
            };

            tg.sendData(JSON.stringify(data));
        });

        // --- 4. ЛОГИКА ДОБАВЛЕНИЯ ГОРОДОВ ---
        function addLocation(locName) {
            const cleanLoc = locName.trim();
            if (cleanLoc.length > 0 && !selectedLocations.includes(cleanLoc)) {
                selectedLocations.push(cleanLoc);
                renderSelectedLocations();
            }
            document.getElementById('location_input').value = '';
            document.getElementById('suggestions').style.display = 'none';
        }

        function renderSelectedLocations() {
            const container = document.getElementById('selected_locations');
            container.innerHTML = '';
            selectedLocations.forEach(loc => {
                const tag = document.createElement('span');
                tag.style.background = 'var(--tg-theme-button-color, #3390ec)';
                tag.style.color = 'var(--tg-theme-button-text-color, #fff)';
                tag.style.padding = '5px 10px';
                tag.style.borderRadius = '15px';
                tag.style.fontSize = '14px';
                tag.style.cursor = 'pointer';
                tag.innerText = loc + ' ✕';
                tag.onclick = () => {
                    selectedLocations = selectedLocations.filter(l => l !== loc);
                    renderSelectedLocations();
                };
                container.appendChild(tag);
            });
        }

        // --- 5. ПОИСК И АВТОЗАПОЛНЕНИЕ (ЛОКАЛЬНАЯ БАЗА + API) ---
        async function searchLocation() {
            const query = document.getElementById('location_input').value.trim();
            const suggestionsBox = document.getElementById('suggestions');
            
            if (query.length < 2) {
                suggestionsBox.style.display = 'none';
                return;
            }

            const queryLower = query.toLowerCase();
            suggestionsBox.innerHTML = ''; 
            suggestionsBox.style.display = 'block';
            
            const filtered = AUSTRIAN_LOCATIONS.filter(loc => loc.toLowerCase().includes(queryLower));
            let localCount = 0;
            
            filtered.forEach(loc => {
                localCount++;
                const div = document.createElement('div');
                div.style.padding = '10px';
                div.style.borderBottom = '1px solid #eee';
                div.style.cursor = 'pointer';
                div.innerText = loc;
                
                div.onclick = () => {
                    const dbValue = loc.split(' (')[0]; 
                    addLocation(dbValue);
                };
                suggestionsBox.appendChild(div);
            });

            clearTimeout(debounceTimer);
            
            debounceTimer = setTimeout(async () => {
                const loaderId = 'api_loader';
                
                if (localCount === 0) {
                    suggestionsBox.innerHTML = `<div id="${loaderId}" style="padding: 10px; color: var(--tg-theme-hint-color, #999);">Ищем по всей Австрии... ⏳</div>`;
                }

                try {
                    const url = `https://nominatim.openstreetmap.org/search?countrycodes=at&format=json&addressdetails=1&accept-language=de&q=${encodeURIComponent(query)}`;
                    const response = await fetch(url, { headers: { "Accept-Language": "de-AT,de;q=0.9" } });
                    const data = await response.json();
                    
                    const loader = document.getElementById(loaderId);
                    if (loader) loader.remove();

                    if (data.length > 0) {
                        data.forEach(place => {
                            const city = place.address.city || place.address.town || place.address.village || place.name;
                            const postcode = place.address.postcode || "";
                            const displayName = postcode ? `${postcode} ${city}` : city;

                            const alreadyInLocal = AUSTRIAN_LOCATIONS.some(local => local.toLowerCase().includes(displayName.toLowerCase()));
                            
                            if (!alreadyInLocal) {
                                const div = document.createElement('div');
                                div.style.padding = '10px';
                                div.style.borderBottom = '1px solid #eee';
                                div.style.cursor = 'pointer';
                                div.innerText = displayName;
                                
                                div.onclick = () => addLocation(displayName);
                                suggestionsBox.appendChild(div);
                            }
                        });
                    } else if (localCount === 0) {
                         suggestionsBox.innerHTML = `<div style="padding: 10px; color: var(--tg-theme-hint-color, #999);">Ничего не найдено 🤷‍♂️</div>`;
                    }
                } catch (error) {
                    console.error("Ошибка API:", error);
                }
            }, 500);
        }
    </script>
</body>
</html>
