<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фильтры Rent Radar</title>
    <!-- Подключаем библиотеку Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Делаем дизайн под стиль Телеграма */
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 20px;
            margin: 0;
        }
        h3 {
            margin-top: 0;
            color: var(--tg-theme-hint-color, #999999);
            font-size: 14px;
            text-transform: uppercase;
        }
        .section {
            margin-bottom: 25px;
        }
        label {
            display: block;
            margin-bottom: 10px;
            font-size: 16px;
        }
        input[type="number"] {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
            border: 1px solid var(--tg-theme-hint-color, #ccc);
            border-radius: 8px;
            background-color: var(--tg-theme-secondary-bg-color, #f4f4f5);
            color: var(--tg-theme-text-color, #000);
            font-size: 16px;
        }
        .row {
            display: flex;
            gap: 10px;
        }
    </style>
</head>
<body>

    <div class="section">
        <h3>Что ищем?</h3>
        <label><input type="checkbox" id="mode_apt" value="apartment" checked> Квартиры (Mietwohnungen)</label>
        <label><input type="checkbox" id="mode_wg" value="wg_zimmer"> Комнаты (WG-Zimmer)</label>
    </div>

    <div class="section">
        <h3>Города</h3>
        <label><input type="checkbox" class="city-checkbox" value="Wien" checked> Вена</label>
        <label><input type="checkbox" class="city-checkbox" value="Graz"> Грац</label>
        <label><input type="checkbox" class="city-checkbox" value="Linz"> Линц</label>
    </div>

    <div class="section">
        <h3>Цена (€)</h3>
        <div class="row">
            <input type="number" id="price_min" placeholder="От">
            <input type="number" id="price_max" placeholder="До">
        </div>
    </div>

    <div class="section">
        <h3>Комнаты</h3>
        <div class="row">
            <input type="number" id="rooms_min" placeholder="От">
            <input type="number" id="rooms_max" placeholder="До">
        </div>
    </div>

    <script>
        // Инициализация Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.expand(); // Открываем на весь экран

        // Настраиваем красивую кнопку внизу экрана
        tg.MainButton.text = "СОХРАНИТЬ ФИЛЬТРЫ";
        tg.MainButton.show();

        // Что происходит при нажатии на кнопку
        tg.MainButton.onClick(() => {
            
            // Собираем выбранные режимы (квартиры/комнаты)
            let searchModes = [];
            if (document.getElementById('mode_apt').checked) searchModes.push('apartment');
            if (document.getElementById('mode_wg').checked) searchModes.push('wg_zimmer');

            // Собираем выбранные города
            let locations = [];
            document.querySelectorAll('.city-checkbox:checked').forEach(cb => locations.push(cb.value));

            // Собираем числа (превращаем текст в числа или оставляем null)
            const getVal = (id) => document.getElementById(id).value ? parseInt(document.getElementById(id).value) : null;

            // Формируем тот самый JSON, который мы спроектировали!
            const data = {
                search_modes: searchModes,
                locations: locations,
                price: {
                    min: getVal('price_min'),
                    max: getVal('price_max')
                },
                rooms: {
                    min: getVal('rooms_min'),
                    max: getVal('rooms_max')
                },
                square_meters: { min: null, max: null } // Оставим задел на будущее
            };

            // Отправляем JSON в бота и закрываем окно
            tg.sendData(JSON.stringify(data));
        });
    </script>
</body>
</html>
