<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фильтры Rent Radar</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 20px;
            margin: 0;
        }
        h3 {
            margin-top: 0;
            color: var(--tg-theme-hint-color, #999999);
            font-size: 14px;
            text-transform: uppercase;
            margin-bottom: 15px;
        }
        .section { margin-bottom: 25px; }
        label { display: block; margin-bottom: 10px; font-size: 16px; }
        input[type="number"], input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
            border: 1px solid var(--tg-theme-hint-color, #ccc);
            border-radius: 8px;
            background-color: var(--tg-theme-secondary-bg-color, #f4f4f5);
            color: var(--tg-theme-text-color, #000);
            font-size: 16px;
        }
        /* Стилизация ползунков под дизайн */
        input[type="range"] {
            width: 100%;
            margin-bottom: 5px;
            accent-color: var(--tg-theme-button-color, #3390ec);
        }
        .row { display: flex; gap: 15px; }
        .col { flex: 1; display: flex; flex-direction: column; }
    </style>
</head>
<body>

    <div class="section">
        <h3>Что ищем?</h3>
        <label><input type="checkbox" id="mode_apt" value="apartment" checked> Квартиры</label>
        <label><input type="checkbox" id="mode_wg" value="wg_zimmer"> Комнаты (WG)</label>
    </div>

    <div class="section">
        <h3>Города или Индексы</h3>
        <div style="position: relative;">
            <input type="text" id="location_input" placeholder="Начни вводить (например: Wien или 1090)..." autocomplete="off" oninput="searchLocation()">
            
            <div id="suggestions" style="display: none; position: absolute; width: 100%; background: var(--tg-theme-bg-color, #fff); border: 1px solid var(--tg-theme-hint-color, #ccc); max-height: 150px; overflow-y: auto; z-index: 100; box-shadow: 0px 4px 6px rgba(0,0,0,0.1);"></div>
        </div>
        <div id="selected_locations" style="margin-top: 10px; display: flex; flex-wrap: wrap; gap: 5px;"></div>
    </div>

    <div class="section">
        <h3>Цена (€)</h3>
        <div class="row">
            <div class="col">
                <input type="range" id="price_min_range" min="0" max="3000" step="50" value="0">
                <input type="number" id="price_min" placeholder="От">
            </div>
            <div class="col">
                <input type="range" id="price_max_range" min="0" max="3000" step="50" value="3000">
                <input type="number" id="price_max" placeholder="До">
            </div>
        </div>
    </div>
    
    <div class="section">
        <h3>Площадь (м²)</h3>
        <div class="row">
            <div class="col">
                <input type="range" id="sq_min_range" min="0" max="200" step="5" value="0">
                <input type="number" id="sq_min" placeholder="От">
            </div>
            <div class="col">
                <input type="range" id="sq_max_range" min="0" max="200" step="5" value="200">
                <input type="number" id="sq_max" placeholder="До">
            </div>
        </div>
    </div>

    <div class="section">
        <h3>Комнаты</h3>
        <div class="row">
            <div class="col">
                <input type="range" id="rooms_min_range" min="1" max="6" step="1" value="1">
                <input type="number" id="rooms_min" placeholder="От">
            </div>
            <div class="col">
                <input type="range" id="rooms_max_range" min="1" max="6" step="1" value="6">
                <input type="number" id="rooms_max" placeholder="До">
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.MainButton.text = "СОХРАНИТЬ ФИЛЬТРЫ";
        tg.MainButton.show();

        // --- ЛОГИКА СИНХРОНИЗАЦИИ ПОЛЗУНКОВ И ПОЛЕЙ ---
        function syncInputs(rangeId, numberId) {
            const range = document.getElementById(rangeId);
            const num = document.getElementById(numberId);

            range.addEventListener('input', () => {
                num.value = range.value > 0 ? range.value : ''; // Оставляем поле пустым, если 0
            });

            num.addEventListener('input', () => {
                if (num.value !== '') {
                    range.value = num.value;
                }
            });
        }

        // Связываем все пары
        syncInputs('price_min_range', 'price_min');
        syncInputs('price_max_range', 'price_max');
        syncInputs('sq_min_range', 'sq_min');
        syncInputs('sq_max_range', 'sq_max');
        syncInputs('rooms_min_range', 'rooms_min');
        syncInputs('rooms_max_range', 'rooms_max');

        // --- ЛОГИКА АВТОЗАПОЛНЕНИЯ ГОРОДОВ ---
        let selectedLocations = [];
        let debounceTimer;

        async function searchLocation() {
            const query = document.getElementById('location_input').value;
            const suggestionsBox = document.getElementById('suggestions');
            
            if (query.length < 2) {
                suggestionsBox.style.display = 'none';
                return;
            }

            clearTimeout(debounceTimer);

            debounceTimer = setTimeout(async () => {
                const url = `https://nominatim.openstreetmap.org/search?countrycodes=at&format=json&addressdetails=1&accept-language=de&q=${encodeURIComponent(query)}`;
                
                try {
                    const response = await fetch(url, {
                        headers: { "Accept-Language": "de-AT,de;q=0.9" }
                    });
                    const data = await response.json();
                    
                    suggestionsBox.innerHTML = ''; 
                    
                    if (data.length > 0) {
                        suggestionsBox.style.display = 'block';
                        data.forEach(place => {
                            const city = place.address.city || place.address.town || place.address.village || place.name;
                            const postcode = place.address.postcode || "";
                            const displayName = postcode ? `${postcode} ${city}` : city;

                            const div = document.createElement('div');
                            div.style.padding = '10px';
                            div.style.borderBottom = '1px solid #eee';
                            div.style.cursor = 'pointer';
                            div.innerText = displayName;
                            
                            div.onclick = () => {
                                if (!selectedLocations.includes(displayName)) {
                                    selectedLocations.push(displayName);
                                    renderSelectedLocations();
                                }
                                document.getElementById('location_input').value = '';
                                suggestionsBox.style.display = 'none';
                            };
                            suggestionsBox.appendChild(div);
                        });
                    } else {
                        suggestionsBox.style.display = 'none';
                    }
                } catch (error) {
                    console.error("Ошибка API подсказок:", error);
                }
            }, 500); 
        }

        function renderSelectedLocations() {
            const container = document.getElementById('selected_locations');
            container.innerHTML = '';
            selectedLocations.forEach(loc => {
                const tag = document.createElement('span');
                tag.style.background = 'var(--tg-theme-button-color, #3390ec)';
                tag.style.color = 'var(--tg-theme-button-text-color, #fff)';
                tag.style.padding = '5px 10px';
                tag.style.borderRadius = '15px';
                tag.style.fontSize = '14px';
                tag.innerText = loc + ' ✕';
                tag.onclick = () => {
                    selectedLocations = selectedLocations.filter(l => l !== loc);
                    renderSelectedLocations();
                };
                container.appendChild(tag);
            });
        }

        // --- СОХРАНЕНИЕ ---
        tg.MainButton.onClick(() => {
            try {
                let searchModes = [];
                if (document.getElementById('mode_apt').checked) searchModes.push('apartment');
                if (document.getElementById('mode_wg').checked) searchModes.push('wg_zimmer');

                const getVal = (id) => {
                    const el = document.getElementById(id);
                    return (el && el.value) ? parseInt(el.value) : null;
                };

                const data = {
                    search_modes: searchModes,
                    locations: selectedLocations,
                    price: { min: getVal('price_min'), max: getVal('price_max') },
                    rooms: { min: getVal('rooms_min'), max: getVal('rooms_max') },
                    square_meters: { min: getVal('sq_min'), max: getVal('sq_max') }
                };

                tg.sendData(JSON.stringify(data));
            } catch (e) {
                tg.showAlert("Ошибка сборки данных: " + e.message);
            }
        });
    </script>
</body>
</html>
