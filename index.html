<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фильтры Rent Radar</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 20px;
            margin: 0;
            padding-bottom: 80px; /* Отступ для главной кнопки ТГ */
        }
        h3 {
            margin-top: 0;
            color: var(--tg-theme-hint-color, #999999);
            font-size: 14px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        .section { margin-bottom: 30px; }
        
        label.checkbox-label { 
            display: flex; 
            align-items: center;
            margin-bottom: 10px; 
            font-size: 16px; 
        }
        input[type="checkbox"] { margin-right: 10px; width: 18px; height: 18px; }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid var(--tg-theme-hint-color, #ccc);
            border-radius: 8px;
            background-color: var(--tg-theme-secondary-bg-color, #f4f4f5);
            color: var(--tg-theme-text-color, #000);
            font-size: 16px;
        }

        /* --- МАГИЯ ДВОЙНОГО ПОЛЗУНКА --- */
        .slider-header {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 15px;
        }
        .dual-slider-container {
            position: relative;
            width: 100%;
            height: 30px;
        }
        .slider-track {
            position: absolute;
            width: 100%;
            height: 4px;
            background-color: var(--tg-theme-hint-color, #d3d3d3);
            border-radius: 4px;
            top: 50%;
            transform: translateY(-50%);
        }
        .slider-progress {
            position: absolute;
            height: 4px;
            background-color: var(--tg-theme-button-color, #3390ec);
            border-radius: 4px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 1;
        }
        .dual-slider-container input[type="range"] {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            margin: 0;
            background: transparent;
            -webkit-appearance: none;
            pointer-events: none; /* Пропускаем клики сквозь инпут */
            z-index: 2;
        }
        .dual-slider-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background-color: var(--tg-theme-button-color, #3390ec);
            border: 3px solid #ffffff;
            box-shadow: 0 1px 4px rgba(0,0,0,0.3);
            pointer-events: auto; /* Возвращаем клики только на кружочки */
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="section">
        <h3>Что ищем?</h3>
        <label class="checkbox-label"><input type="checkbox" id="mode_apt" value="apartment" checked> Квартиры</label>
        <label class="checkbox-label"><input type="checkbox" id="mode_wg" value="wg_zimmer"> Комнаты (WG)</label>
    </div>

    <div class="section">
        <h3>Города или Индексы</h3>
        <div style="position: relative;">
            <input type="text" id="location_input" placeholder="Начни вводить (например: Wien или 1090)..." autocomplete="off" oninput="searchLocation()">
            <div id="suggestions" style="display: none; position: absolute; width: 100%; background: var(--tg-theme-bg-color, #fff); border: 1px solid var(--tg-theme-hint-color, #ccc); max-height: 150px; overflow-y: auto; z-index: 100; box-shadow: 0px 4px 6px rgba(0,0,0,0.1);"></div>
        </div>
        <div id="selected_locations" style="margin-top: 10px; display: flex; flex-wrap: wrap; gap: 5px;"></div>
    </div>

    <div class="section">
        <h3>Цена</h3>
        <div class="slider-header">
            <span id="price_display_min">€0</span>
            <span id="price_display_max">€3000+</span>
        </div>
        <div class="dual-slider-container">
            <div class="slider-track"></div>
            <div class="slider-progress" id="price_progress"></div>
            <input type="range" id="price_min" min="0" max="3000" step="50" value="0">
            <input type="range" id="price_max" min="0" max="3000" step="50" value="3000">
        </div>
    </div>
    
    <div class="section">
        <h3>Площадь</h3>
        <div class="slider-header">
            <span id="sq_display_min">0 м²</span>
            <span id="sq_display_max">150+ м²</span>
        </div>
        <div class="dual-slider-container">
            <div class="slider-track"></div>
            <div class="slider-progress" id="sq_progress"></div>
            <input type="range" id="sq_min" min="0" max="150" step="5" value="0">
            <input type="range" id="sq_max" min="0" max="150" step="5" value="150">
        </div>
    </div>

    <div class="section">
        <h3>Комнаты</h3>
        <div class="slider-header">
            <span id="rooms_display_min">1</span>
            <span id="rooms_display_max">6+</span>
        </div>
        <div class="dual-slider-container">
            <div class="slider-track"></div>
            <div class="slider-progress" id="rooms_progress"></div>
            <input type="range" id="rooms_min" min="1" max="6" step="1" value="1">
            <input type="range" id="rooms_max" min="1" max="6" step="1" value="6">
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.MainButton.text = "СОХРАНИТЬ ФИЛЬТРЫ";
        tg.MainButton.show();

        // --- ЛОГИКА ДВОЙНЫХ ПОЛЗУНКОВ ---
        function initDualSlider(idMin, idMax, idProgress, idDisplayMin, idDisplayMax, prefix, suffix) {
            const minSlider = document.getElementById(idMin);
            const maxSlider = document.getElementById(idMax);
            const progress = document.getElementById(idProgress);
            const displayMin = document.getElementById(idDisplayMin);
            const displayMax = document.getElementById(idDisplayMax);
            
            const maxAllowed = parseInt(maxSlider.max);
            const minAllowed = parseInt(minSlider.min);

            function updateSlider(e) {
                let minVal = parseInt(minSlider.value);
                let maxVal = parseInt(maxSlider.value);

                // Не даем ползункам пересечься
                if (minVal >= maxVal) {
                    if (e.target === minSlider) {
                        minSlider.value = maxVal - parseInt(minSlider.step);
                        minVal = parseInt(minSlider.value);
                    } else {
                        maxSlider.value = minVal + parseInt(maxSlider.step);
                        maxVal = parseInt(maxSlider.value);
                    }
                }

                // Закрашиваем прогресс между точками
                const minPercent = ((minVal - minAllowed) / (maxAllowed - minAllowed)) * 100;
                const maxPercent = ((maxVal - minAllowed) / (maxAllowed - minAllowed)) * 100;
                
                progress.style.left = minPercent + "%";
                progress.style.width = (maxPercent - minPercent) + "%";

                // Обновляем текст (добавляем "+" если выбран максимум)
                displayMin.innerText = prefix + minVal + suffix;
                displayMax.innerText = prefix + (maxVal === maxAllowed ? maxVal + "+" : maxVal) + suffix;
            }

            minSlider.addEventListener('input', updateSlider);
            maxSlider.addEventListener('input', updateSlider);
            
            // Инициализация при старте
            updateSlider({target: minSlider});
        }

        initDualSlider('price_min', 'price_max', 'price_progress', 'price_display_min', 'price_display_max', '€', '');
        initDualSlider('sq_min', 'sq_max', 'sq_progress', 'sq_display_min', 'sq_display_max', '', ' м²');
        initDualSlider('rooms_min', 'rooms_max', 'rooms_progress', 'rooms_display_min', 'rooms_display_max', '', '');

        // --- 1. HYDRATION: ПОДСТАНОВКА ПРОШЛЫХ ФИЛЬТРОВ ---
        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);

            // Подставляем чекбоксы
            if (urlParams.has('modes')) {
                const modes = urlParams.get('modes').split(',');
                document.getElementById('mode_apt').checked = modes.includes('apartment');
                document.getElementById('mode_wg').checked = modes.includes('wg_zimmer');
            }

            // Подставляем сохраненные города
            if (urlParams.has('cities')) {
                const citiesStr = urlParams.get('cities');
                if (citiesStr) {
                    selectedLocations = citiesStr.split(',');
                    renderSelectedLocations();
                }
            }

            // Подставляем ползунки
            const setSliderVal = (id, param) => {
                if (urlParams.has(param)) {
                    const slider = document.getElementById(id);
                    slider.value = urlParams.get(param);
                    // Важный момент: вызываем событие 'input', чтобы скрипт перерисовал визуал ползунка
                    slider.dispatchEvent(new Event('input'));
                }
            };

            setSliderVal('price_min', 'min_price');
            setSliderVal('price_max', 'max_price');
            setSliderVal('sq_min', 'min_sq');
            setSliderVal('sq_max', 'max_sq');
            setSliderVal('rooms_min', 'min_rooms');
            setSliderVal('rooms_max', 'max_rooms');
        });
        // --- КОНЕЦ БЛОКА HYDRATION ---

        // --- ЛОГИКА АВТОЗАПОЛНЕНИЯ ГОРОДОВ ---
        let selectedLocations = [];
        let debounceTimer;

        async function searchLocation() {
            let selectedLocations = [];
        let debounceTimer; // Таймер для API
        
        // Наша быстрая база
        const AUSTRIAN_LOCATIONS = [
            "Wien (Вся Вена)",
            "1010 Wien (Innere Stadt)", "1020 Wien (Leopoldstadt)", "1030 Wien (Landstraße)",
            "1040 Wien (Wieden)", "1050 Wien (Margareten)", "1060 Wien (Mariahilf)",
            "1070 Wien (Neubau)", "1080 Wien (Josefstadt)", "1090 Wien (Alsergrund)",
            "1100 Wien (Favoriten)", "1110 Wien (Simmering)", "1120 Wien (Meidling)",
            "1130 Wien (Hietzing)", "1140 Wien (Penzing)", "1150 Wien (Rudolfsheim-Fünfhaus)",
            "1160 Wien (Ottakring)", "1170 Wien (Hernals)", "1180 Wien (Währing)",
            "1190 Wien (Döbling)", "1200 Wien (Brigittenau)", "1210 Wien (Floridsdorf)",
            "1220 Wien (Donaustadt)", "1230 Wien (Liesing)",
            "Graz", "Linz", "Salzburg", "Innsbruck", "Klagenfurt", "Villach", 
            "Wels", "St. Pölten", "Dornbirn", "Wiener Neustadt"
        ];

        function addLocation(locName) {
            const cleanLoc = locName.trim();
            if (cleanLoc.length > 0 && !selectedLocations.includes(cleanLoc)) {
                selectedLocations.push(cleanLoc);
                renderSelectedLocations();
            }
            document.getElementById('location_input').value = '';
            document.getElementById('suggestions').style.display = 'none';
        }

        async function searchLocation() {
            const query = document.getElementById('location_input').value.trim();
            const suggestionsBox = document.getElementById('suggestions');
            
            if (query.length < 2) {
                suggestionsBox.style.display = 'none';
                return;
            }

            const queryLower = query.toLowerCase();
            suggestionsBox.innerHTML = ''; 
            suggestionsBox.style.display = 'block';
            
            // 1. БЫСТРЫЙ ЛОКАЛЬНЫЙ ПОИСК
            const filtered = AUSTRIAN_LOCATIONS.filter(loc => loc.toLowerCase().includes(queryLower));
            let localCount = 0;
            
            filtered.forEach(loc => {
                localCount++;
                const div = document.createElement('div');
                div.style.padding = '10px';
                div.style.borderBottom = '1px solid #eee';
                div.style.cursor = 'pointer';
                div.innerText = loc;
                
                div.onclick = () => {
                    const dbValue = loc.split(' (')[0]; 
                    addLocation(dbValue);
                };
                suggestionsBox.appendChild(div);
            });

            // 2. ПОДКЛЮЧАЕМ API, ЕСЛИ ЮЗЕР ИЩЕТ РЕДКИЙ ГОРОД
            clearTimeout(debounceTimer);
            
            debounceTimer = setTimeout(async () => {
                const loaderId = 'api_loader';
                
                // Если локальная база ничего не нашла, показываем текст загрузки
                if (localCount === 0) {
                    suggestionsBox.innerHTML = `<div id="${loaderId}" style="padding: 10px; color: var(--tg-theme-hint-color, #999);">Ищем по всей Австрии... ⏳</div>`;
                }

                try {
                    const url = `https://nominatim.openstreetmap.org/search?countrycodes=at&format=json&addressdetails=1&accept-language=de&q=${encodeURIComponent(query)}`;
                    const response = await fetch(url, { headers: { "Accept-Language": "de-AT,de;q=0.9" } });
                    const data = await response.json();
                    
                    const loader = document.getElementById(loaderId);
                    if (loader) loader.remove();

                    if (data.length > 0) {
                        data.forEach(place => {
                            const city = place.address.city || place.address.town || place.address.village || place.name;
                            const postcode = place.address.postcode || "";
                            const displayName = postcode ? `${postcode} ${city}` : city;

                            // Добавляем город из API, только если его еще нет в нашем локальном списке
                            const alreadyInLocal = AUSTRIAN_LOCATIONS.some(local => local.toLowerCase().includes(displayName.toLowerCase()));
                            
                            if (!alreadyInLocal) {
                                const div = document.createElement('div');
                                div.style.padding = '10px';
                                div.style.borderBottom = '1px solid #eee';
                                div.style.cursor = 'pointer';
                                div.innerText = displayName;
                                
                                div.onclick = () => addLocation(displayName);
                                suggestionsBox.appendChild(div);
                            }
                        });
                    } else if (localCount === 0) {
                         suggestionsBox.innerHTML = `<div style="padding: 10px; color: var(--tg-theme-hint-color, #999);">Ничего не найдено 🤷‍♂️</div>`;
                    }
                } catch (error) {
                    console.error("Ошибка API:", error);
                }
            }, 500); // Задержка в 500мс, чтобы API не дергалось на каждую букву
        } 
        }

        function renderSelectedLocations() {
            const container = document.getElementById('selected_locations');
            container.innerHTML = '';
            selectedLocations.forEach(loc => {
                const tag = document.createElement('span');
                tag.style.background = 'var(--tg-theme-button-color, #3390ec)';
                tag.style.color = 'var(--tg-theme-button-text-color, #fff)';
                tag.style.padding = '5px 10px';
                tag.style.borderRadius = '15px';
                tag.style.fontSize = '14px';
                tag.innerText = loc + ' ✕';
                tag.onclick = () => {
                    selectedLocations = selectedLocations.filter(l => l !== loc);
                    renderSelectedLocations();
                };
                container.appendChild(tag);
            });
        }

        // --- СОХРАНЕНИЕ С УМНОЙ ОТПРАВКОЙ NULL ---
        tg.MainButton.onClick(() => {
            try {
                let searchModes = [];
                if (document.getElementById('mode_apt').checked) searchModes.push('apartment');
                if (document.getElementById('mode_wg').checked) searchModes.push('wg_zimmer');

                // Функция, которая отправляет null, если ползунок стоит на максимуме или минимуме
                const getSmartVal = (id, isMax = false) => {
                    const el = document.getElementById(id);
                    const val = parseInt(el.value);
                    if (isMax && val === parseInt(el.max)) return null; // "Безлимит"
                    if (!isMax && val === parseInt(el.min)) return null; // От нуля
                    return val;
                };

                const data = {
                    search_modes: searchModes,
                    locations: selectedLocations,
                    price: { min: getSmartVal('price_min'), max: getSmartVal('price_max', true) },
                    rooms: { min: getSmartVal('rooms_min'), max: getSmartVal('rooms_max', true) },
                    square_meters: { min: getSmartVal('sq_min'), max: getSmartVal('sq_max', true) }
                };

                tg.sendData(JSON.stringify(data));
            } catch (e) {
                tg.showAlert("Ошибка сборки данных: " + e.message);
            }
        });
    </script>
</body>
</html>
