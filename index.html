<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фильтры Rent Radar</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 20px;
            margin: 0;
        }
        h3 {
            margin-top: 0;
            color: var(--tg-theme-hint-color, #999999);
            font-size: 14px;
            text-transform: uppercase;
        }
        .section { margin-bottom: 25px; }
        label { display: block; margin-bottom: 10px; font-size: 16px; }
        input[type="number"], input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
            border: 1px solid var(--tg-theme-hint-color, #ccc);
            border-radius: 8px;
            background-color: var(--tg-theme-secondary-bg-color, #f4f4f5);
            color: var(--tg-theme-text-color, #000);
            font-size: 16px;
        }
        .row { display: flex; gap: 10px; }
    </style>
</head>
<body>

    <div class="section">
        <h3>Что ищем?</h3>
        <label><input type="checkbox" id="mode_apt" value="apartment" checked> Квартиры</label>
        <label><input type="checkbox" id="mode_wg" value="wg_zimmer"> Комнаты (WG)</label>
    </div>

    <!-- ТЕПЕРЬ ТУТ ТЕКСТОВОЕ ПОЛЕ -->
    <div class="section">
        <h3>Города или Индексы (через запятую)</h3>
        <input type="text" id="locations" placeholder="Например: Wien, Graz, 4300">
    </div>

    <div class="section">
        <h3>Цена (€)</h3>
        <div class="row">
            <input type="number" id="price_min" placeholder="От">
            <input type="number" id="price_max" placeholder="До">
        </div>
    </div>
    
    <!-- НОВОЕ ПОЛЕ ПЛОЩАДИ -->
    <div class="section">
        <h3>Площадь (м²)</h3>
        <div class="row">
            <input type="number" id="sq_min" placeholder="От">
            <input type="number" id="sq_max" placeholder="До">
        </div>
    </div>

    <div class="section">
        <h3>Комнаты</h3>
        <div class="row">
            <input type="number" id="rooms_min" placeholder="От">
            <input type="number" id="rooms_max" placeholder="До">
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.MainButton.text = "СОХРАНИТЬ ФИЛЬТРЫ";
        tg.MainButton.show();

        tg.MainButton.onClick(() => {
            let searchModes = [];
            if (document.getElementById('mode_apt').checked) searchModes.push('apartment');
            if (document.getElementById('mode_wg').checked) searchModes.push('wg_zimmer');

            // Разбиваем строку с городами на массив
            let locString = document.getElementById('locations').value;
            let locations = locString.split(',').map(s => s.trim()).filter(s => s.length > 0);

            const getVal = (id) => document.getElementById(id).value ? parseInt(document.getElementById(id).value) : null;

            const data = {
                search_modes: searchModes,
                locations: locations,
                price: { min: getVal('price_min'), max: getVal('price_max') },
                rooms: { min: getVal('rooms_min'), max: getVal('rooms_max') },
                square_meters: { min: getVal('sq_min'), max: getVal('sq_max') }
            };

            tg.sendData(JSON.stringify(data));
        });
    </script>
</body>
</html>
